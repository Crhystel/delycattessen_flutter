name: CI/CD Flutter

# Pipeline por etapas. 1 y 2 corren en paralelo en cada pull request; el APK (3) se
# construye solo al hacer push a develop/main, con un tag v* o a mano.
#
#   1 · Análisis ─┐
#                 ├─► 3 · Build APK ─► 4 · Publicar
#   2 · Tests ────┘

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths-ignore: ["**.md", ".github/modernize/**"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md", ".github/modernize/**"]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Misma versión que se usa en local, para que el CI y tu equipo coincidan.
  FLUTTER_VERSION: "3.44.8"

jobs:
  # -------------------------------------------------------------- 1 · Análisis
  analyze:
    name: "1 · Análisis"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

  # ----------------------------------------------------------------- 2 · Tests
  test:
    name: "2 · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: flutter test con cobertura
        run: flutter test --coverage

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage/lcov.info') != ''
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf > 0) printf "### Cobertura de tests\n\n**%.1f%%** de las líneas están cubiertas por los tests.\n", lh*100/lf
          }' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 3

  # ---------------------------------------------------------------- 3 · APK
  build-apk:
    name: "3 · Build APK"
    needs: [analyze, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      # La configuración sale de env.example.json (env.json real no está en git).
      # STAGING_API_URL (variable del repo) reemplaza API_BASE_URL con el backend de staging.
      - name: Preparar configuración de la app
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            jq --arg u "$API_URL" '.API_BASE_URL = $u' env.example.json > env.ci.json
          else
            cp env.example.json env.ci.json
          fi

      - name: Construir APK release
        run: flutter build apk --release --dart-define-from-file=env.ci.json

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: delycattessen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ------------------------------------------------------------- 4 · Publicar
  publish:
    name: "4 · Publicar"
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: delycattessen-apk

      - name: Resumen
        run: |
          {
            echo "### APK listo"
            echo
            echo "Descárgalo en la sección **Artifacts** de esta corrida (\`delycattessen-apk\`, disponible 7 días)."
            echo
            echo "Rama/tag: \`${GITHUB_REF_NAME}\` · Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Con un tag v* (p. ej. v1.0.0) además se crea un Release con el APK adjunto.
      - name: Crear Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
